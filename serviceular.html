<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ular Tangga: Pelayanan Prima</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-green: #39ff14;
            --neon-glow: 0 0 10px rgba(57, 255, 20, 0.7);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #ff003c;
            --info: #00f3ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(57, 255, 20, 0.1) 0%, transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 243, 255, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .screen.active { display: flex; flex-direction: column; align-items: center; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* GLASSMORPHISM UI */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1, h2 { text-align: center; margin-bottom: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .text-neon { color: var(--neon-green); text-shadow: var(--neon-glow); }

        input, select {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border);
            color: white; border-radius: 8px; font-size: 16px; outline: none;
            transition: all 0.3s;
        }
        input:focus, select:focus { border-color: var(--neon-green); box-shadow: 0 0 5px var(--neon-green); }

        .btn {
            background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green);
            padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase; width: 100%;
        }
        .btn:hover, .btn:active {
            background: var(--neon-green); color: black; box-shadow: var(--neon-glow);
        }

        /* GAME BOARD (6x6) */
        .board-container {
            position: relative; width: 100%; aspect-ratio: 1/1; 
            background: rgba(0,0,0,0.6); border: 2px solid var(--glass-border); border-radius: 8px;
            margin-bottom: 20px; overflow: hidden;
        }
        .board-grid {
            display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
            width: 100%; height: 100%; position: absolute; z-index: 1;
        }
        .cell {
            border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: rgba(255,255,255,0.3); position: relative;
        }
        .cell:nth-child(even) { background: rgba(255,255,255,0.02); }
        
        /* SNAKES & LADDERS SVG OVERLAYS */
        .svg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        
        /* PLAYER TOKEN */
        .player-token {
            position: absolute; width: 60%; height: 60%;
            background: var(--neon-green); border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-green); z-index: 5;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); /* Bouncy move */
            top: 0; left: 0; pointer-events: none;
        }

        /* 3D DICE CSS ONLY */
        .dice-wrapper { perspective: 600px; margin: 20px auto; width: 60px; height: 60px; cursor: pointer; }
        .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1s ease-out; }
        .face { position: absolute; width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 2px solid var(--neon-green); border-radius: 8px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 5px; backdrop-filter: blur(4px); box-shadow: inset 0 0 10px rgba(57,255,20,0.2); }
        .dot { width: 10px; height: 10px; background: var(--neon-green); border-radius: 50%; margin: auto; box-shadow: var(--neon-glow); }
        
        .front  { transform: translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        /* QUIZ MODAL */
        .modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); z-index: 100; display: none;
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal.active { display: flex; }
        .quiz-opt {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .quiz-opt:hover { background: rgba(57, 255, 20, 0.2); border-color: var(--neon-green); }

        /* STATS */
        .stats-bar { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; font-weight: bold; }
        
        /* LEADERBOARD LIST */
        .lb-item {
            display: flex; justify-content: space-between; padding: 12px;
            border-bottom: 1px solid var(--glass-border); font-size: 14px;
        }
        .lb-item:nth-child(1) .rank { color: gold; text-shadow: 0 0 5px gold; font-size: 16px; }
        .lb-item:nth-child(2) .rank { color: silver; }
        .lb-item:nth-child(3) .rank { color: #cd7f32; }

    </style>
</head>
<body>

    <!-- SCREEN 1: MULAI -->
    <div id="screen-start" class="screen active">
        <div class="glass-panel">
            <h1>Ular Tangga<br><span class="text-neon">Pelayanan Prima</span></h1>
            <p style="text-align: center; margin-bottom: 20px; font-size: 14px; color: var(--text-muted);">Materi: Konsep & Karakteristik Pelayanan Prima SMK Kelas X</p>
            
            <input type="text" id="input-nama" placeholder="Nama Lengkap" required>
            <select id="input-kelas">
                <option value="" disabled selected>Pilih Kelas</option>
                <option value="X-AKL">X - Akuntansi (AKL)</option>
                <option value="X-BDP">X - Bisnis Digital (BDP)</option>
                <option value="X-OTKP">X - Manajemen Perkantoran (OTKP)</option>
            </select>
            <button class="btn" onclick="startGame()">Mulai Main!</button>
        </div>
    </div>

    <!-- SCREEN 2: GAME BOARD -->
    <div id="screen-game" class="screen">
        <div class="stats-bar">
            <span>Pemain: <span id="ui-nama" class="text-neon"></span></span>
            <span>Skor: <span id="ui-skor" class="text-neon">0</span></span>
        </div>
        
        <div class="board-container">
            <div class="board-grid" id="board-grid"></div>
            <!-- Native SVG for Snakes and Ladders Mapping -->
            <svg class="svg-overlay" id="board-svg" viewBox="0 0 600 600" preserveAspectRatio="none">
                <!-- Data will be injected here via JS -->
            </svg>
            <div class="player-token" id="player"></div>
        </div>

        <div style="text-align: center; width: 100%;">
            <p id="game-msg" style="height: 20px; color: var(--info); font-weight: bold; margin-bottom: 10px;">Roll dadu untuk mulai!</p>
            <div class="dice-wrapper" onclick="rollDice()">
                <div class="dice" id="dice-3d">
                    <div class="face front"><div class="dot" style="grid-area: 2/2"></div></div>
                    <div class="face back">
                        <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div>
                        <div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div>
                        <div class="dot" style="grid-area: 2/1"></div><div class="dot" style="grid-area: 2/3"></div>
                    </div>
                    <div class="face right">
                        <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 2/2"></div><div class="dot" style="grid-area: 3/3"></div>
                    </div>
                    <div class="face left">
                        <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/1"></div>
                        <div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 3/3"></div>
                    </div>
                    <div class="face top">
                        <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 3/3"></div>
                    </div>
                    <div class="face bottom">
                        <div class="dot" style="grid-area: 1/1"></div><div class="dot" style="grid-area: 1/3"></div><div class="dot" style="grid-area: 2/2"></div>
                        <div class="dot" style="grid-area: 3/1"></div><div class="dot" style="grid-area: 3/3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- QUIZ MODAL -->
    <div id="quiz-modal" class="modal">
        <div class="glass-panel" style="max-width: 400px; text-align: center;">
            <h2 id="q-title" class="text-neon">Pertanyaan!</h2>
            <p id="q-text" style="margin-bottom: 20px;"></p>
            <div id="q-options" style="text-align: left;"></div>
        </div>
    </div>

    <!-- SCREEN 3: RESULT & LEADERBOARD -->
    <div id="screen-result" class="screen">
        <div class="glass-panel" style="margin-bottom: 20px;">
            <h2>🎉 Selesai! 🎉</h2>
            <div style="text-align: center; margin-bottom: 20px;">
                <p>Total Skor Anda:</p>
                <h1 class="text-neon" style="font-size: 48px; margin: 10px 0;" id="res-skor">100</h1>
                <p>Waktu: <span id="res-waktu" class="text-neon">00:00</span></p>
                <p id="save-status" style="margin-top:10px; font-size: 12px; color: var(--info);">Menyimpan data ke server...</p>
            </div>
            <button class="btn" onclick="location.reload()">Main Lagi</button>
        </div>

        <div class="glass-panel">
            <h3 style="text-align: center; margin-bottom: 15px;">🏆 LEADERBOARD</h3>
            <div id="lb-list">
                <div style="text-align: center; font-size: 12px; color: gray;">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        // DATA MATERI & KUIS KOCAK (PELAYANAN PRIMA)
        const quizBank = [
            { q: "Pelanggan datang nyari barang yang lagi kosong. Apa sikap pelayanan prima yang bener?", a: ["Jutekin aja, salah sendiri gak booking", "Senyum, minta maaf, lalu tawarkan alternatif barang lain", "Pura-pura budek sambil main HP", "Suruh cari di toko sebelah pakai nada ngegas"], ans: 1 },
            { q: "Apa sih inti dari 'Pelayanan Prima' (Excellent Service)?", a: ["Bikin pelanggan ngutang terus", "Melayani melebihi harapan pelanggan biar mereka puas", "Cari muka di depan bos doang", "Jual barang semahal-mahalnya"], ans: 1 },
            { q: "Salah satu karakteristik pelayanan prima adalah A3. Apa itu A3?", a: ["Attitude, Attention, Action", "Asal, Acak, Ambyar", "Ayam, Ati, Ampela", "Anak, Akuntansi, Aman"], ans: 0 },
            { q: "Kalau kita kerja dengan 'Tepat dan Cepat', manfaat buat perusahaan apa?", a: ["Jam istirahat jadi lebih panjang", "Citra perusahaan naik, pelanggan jadi loyal", "Bisa pulang lebih cepet", "Dimarahin HRD"], ans: 1 },
            { q: "Pelanggan lagi ngomel-ngomel (komplain). Sikap kamu?", a: ["Ajak ribut sekalian di parkiran", "Dengerin dengan sabar, empati, dan cari solusi", "Nangis di pojokan kasir", "Tutup kuping sambil bilang 'LALALA'"], ans: 1 }
        ];

        // KONFIGURASI PAPAN (36 Kotak, 6x6)
        const TOTAL_SQUARES = 36;
        const GRID_SIZE = 6;
        
        // Snakes (Turun): Mendarat -> Turun
        const snakes = [
            { start: 16, end: 6, msg: "Jutek ke pelanggan! Turun ke 6" },
            { start: 30, end: 11, msg: "Main HP pas kerja! Turun ke 11" },
            { start: 34, end: 20, msg: "Bales chat judes! Turun ke 20" }
        ];
        
        // Ladders (Naik): Mendarat -> Naik
        const ladders = [
            { start: 4, end: 14, msg: "Senyum & Ramah! Naik ke 14" },
            { start: 9, end: 22, msg: "Cepat tanggap! Naik ke 22" },
            { start: 27, end: 33, msg: "Problem Solved! Naik ke 33" }
        ];

        // Quiz Triggers (Kotak tertentu)
        const quizSquares = [7, 13, 19, 25, 28];

        // STATE GAME
        let state = {
            nama: '', kelas: '', pos: 1, skor: 0, 
            startTime: null, isRolling: false, boardCoords: []
        };

        // RUN BACKEND (Canvas Mock/Fallback System)
        const runBackend = (functionName, ...args) => {
            return new Promise((resolve, reject) => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        [functionName](...args);
                } else {
                    // MOCK DATA for Canvas Preview
                    console.log(`[MOCK EXECUTED] ${functionName}`, args);
                    setTimeout(() => {
                        if (functionName === 'savePlayerScore') resolve({ status: 'success' });
                        if (functionName === 'getLeaderboard') {
                            resolve({
                                data: [
                                    { rank: 1, name: args[0]? args[0]:"Rizky (Mock)", kelas: "X-AKL", score: 500, time: "01:30" },
                                    { rank: 2, name: "Budi (Mock)", kelas: "X-BDP", score: 350, time: "02:15" },
                                    { rank: 3, name: "Siti (Mock)", kelas: "X-OTKP", score: 200, time: "03:00" }
                                ]
                            });
                        }
                    }, 800);
                }
            });
        };

        // INIT BOARD
        function initBoard() {
            const grid = document.getElementById('board-grid');
            const svg = document.getElementById('board-svg');
            grid.innerHTML = ''; svg.innerHTML = '';
            
            let cellsHTML = '';
            // Boustrophedon pattern creation (bottom-up logic, but rendered in DOM top-down)
            for (let r = 0; r < GRID_SIZE; r++) {
                let rowSquares = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    let num = (GRID_SIZE - 1 - r) * GRID_SIZE + c + 1;
                    if (r % 2 !== (GRID_SIZE % 2 === 0 ? 1 : 0)) {
                        num = (GRID_SIZE - 1 - r) * GRID_SIZE + (GRID_SIZE - c);
                    }
                    rowSquares.push(num);
                    cellsHTML += `<div class="cell" id="c-${num}">${num}</div>`;
                }
            }
            grid.innerHTML = cellsHTML;

            // Generate Coordinates for SVG & Movement after brief DOM render
            setTimeout(() => {
                state.boardCoords = [];
                for(let i = 1; i <= TOTAL_SQUARES; i++) {
                    let el = document.getElementById(`c-${i}`);
                    let rect = el.getBoundingClientRect();
                    let pRect = grid.getBoundingClientRect();
                    state.boardCoords[i] = {
                        x: rect.left - pRect.left + (rect.width/2),
                        y: rect.top - pRect.top + (rect.height/2),
                        w: rect.width, h: rect.height
                    };
                }
                drawSnakesAndLadders();
                movePlayerUI(1);
            }, 100);
        }

        // DRAW SVG SNAKES & LADDERS (Responsive Scale 600x600 viewBox)
        function drawSnakesAndLadders() {
            const svg = document.getElementById('board-svg');
            const cw = state.boardCoords[1].w; // ref cell width
            const scale = 600 / document.getElementById('board-grid').clientWidth;

            let svgContent = '';
            // Draw Ladders (Cyan dashed lines)
            ladders.forEach(l => {
                const s = state.boardCoords[l.start];
                const e = state.boardCoords[l.end];
                svgContent += `<line x1="${s.x * scale}" y1="${s.y * scale}" x2="${e.x * scale}" y2="${e.y * scale}" stroke="rgba(0, 243, 255, 0.6)" stroke-width="15" stroke-dasharray="10 5" stroke-linecap="round"/>`;
            });

            // Draw Snakes (Red/Purple curves)
            snakes.forEach(s => {
                const st = state.boardCoords[s.start];
                const en = state.boardCoords[s.end];
                // Simple Bezier curve offset to make it look wiggly
                const mx = ((st.x + en.x)/2 + 40) * scale;
                const my = ((st.y + en.y)/2) * scale;
                svgContent += `<path d="M${st.x*scale},${st.y*scale} Q${mx},${my} ${en.x*scale},${en.y*scale}" fill="none" stroke="rgba(255, 0, 60, 0.6)" stroke-width="8" />`;
            });
            svg.innerHTML = svgContent;
        }

        // START GAME
        function startGame() {
            state.nama = document.getElementById('input-nama').value;
            state.kelas = document.getElementById('input-kelas').value;
            if(!state.nama || !state.kelas) { alert('Isi Nama dan Kelas dulu, Bosku!'); return; }
            
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            
            document.getElementById('ui-nama').innerText = state.nama;
            state.startTime = new Date();
            initBoard();
        }

        // ANIMATE DICE & MOVE
        function rollDice() {
            if(state.isRolling) return;
            state.isRolling = true;
            document.getElementById('game-msg').innerText = "Ngocok dadu...";
            
            const dice = document.getElementById('dice-3d');
            const roll = Math.floor(Math.random() * 6) + 1;
            
            // Random CSS 3D Rotation Math
            const xRand = Math.floor(Math.random() * 4) * 360;
            const yRand = Math.floor(Math.random() * 4) * 360;
            
            let rotX = xRand; let rotY = yRand;
            switch(roll) {
                case 1: rotX += 0; rotY += 0; break;
                case 2: rotX += 0; rotY += -90; break;
                case 3: rotX += 0; rotY += 90; break;
                case 4: rotX += 0; rotY += 180; break;
                case 5: rotX += -90; rotY += 0; break;
                case 6: rotX += 90; rotY += 0; break;
            }
            
            dice.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            setTimeout(() => {
                document.getElementById('game-msg').innerText = `Dapat angka ${roll}!`;
                processMove(roll);
            }, 1200);
        }

        function movePlayerUI(pos) {
            const p = document.getElementById('player');
            const c = state.boardCoords[pos];
            if(c) {
                p.style.width = (c.w * 0.6) + 'px';
                p.style.height = (c.h * 0.6) + 'px';
                p.style.transform = `translate(${c.x - (c.w*0.3)}px, ${c.y - (c.h*0.3)}px)`;
            }
        }

        function updateScore(points) {
            state.skor += points;
            document.getElementById('ui-skor').innerText = state.skor;
        }

        // LOGIC LOMPAT KOTAK
        async function processMove(roll) {
            let target = state.pos + roll;
            if(target > TOTAL_SQUARES) target = TOTAL_SQUARES; // Mentok finish
            
            // Step-by-step move animation
            for(let i = state.pos + 1; i <= target; i++) {
                movePlayerUI(i);
                await new Promise(r => setTimeout(r, 200));
            }
            
            state.pos = target;
            updateScore(10); // +10 tiap jalan

            // Check Snake
            const snake = snakes.find(s => s.start === state.pos);
            if(snake) {
                document.getElementById('game-msg').innerText = snake.msg;
                document.getElementById('game-msg').style.color = 'var(--danger)';
                updateScore(-20);
                await new Promise(r => setTimeout(r, 1000));
                state.pos = snake.end;
                movePlayerUI(state.pos);
            }

            // Check Ladder
            const ladder = ladders.find(l => l.start === state.pos);
            if(ladder) {
                document.getElementById('game-msg').innerText = ladder.msg;
                document.getElementById('game-msg').style.color = 'var(--neon-green)';
                updateScore(30);
                await new Promise(r => setTimeout(r, 1000));
                state.pos = ladder.end;
                movePlayerUI(state.pos);
            }

            // Reset msg color
            setTimeout(() => document.getElementById('game-msg').style.color = 'var(--info)', 1500);

            // Check Quiz
            if(quizSquares.includes(state.pos)) {
                await triggerQuiz();
            } else {
                checkWin();
            }
        }

        // KUIS LOGIC
        function triggerQuiz() {
            return new Promise((resolve) => {
                const modal = document.getElementById('quiz-modal');
                const q = quizBank[Math.floor(Math.random() * quizBank.length)];
                
                document.getElementById('q-text').innerText = q.q;
                const optsDiv = document.getElementById('q-options');
                optsDiv.innerHTML = '';
                
                q.a.forEach((opt, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'quiz-opt';
                    btn.innerText = opt;
                    btn.onclick = () => {
                        modal.classList.remove('active');
                        if(idx === q.ans) {
                            alert("Benaaarrr! Pelayanan prima level dewa! +50 Poin");
                            updateScore(50);
                        } else {
                            alert("Salaaahhh! Gini kok mau kerja di industri? Dikurangi 20 Poin!");
                            updateScore(-20);
                        }
                        checkWin();
                        resolve();
                    };
                    optsDiv.appendChild(btn);
                });
                
                modal.classList.add('active');
            });
        }

        // CEK MENANG
        function checkWin() {
            if(state.pos === TOTAL_SQUARES) {
                const endTime = new Date();
                const diffSec = Math.floor((endTime - state.startTime) / 1000);
                const timeBonus = Math.max(0, 300 - diffSec); // Bonus skor cepat
                updateScore(timeBonus);
                
                const mins = String(Math.floor(diffSec / 60)).padStart(2, '0');
                const secs = String(diffSec % 60).padStart(2, '0');
                const timeStr = `${mins}:${secs}`;
                
                document.getElementById('screen-game').classList.remove('active');
                document.getElementById('screen-result').classList.add('active');
                
                document.getElementById('res-skor').innerText = state.skor;
                document.getElementById('res-waktu').innerText = timeStr;
                
                saveDataAndLoadLeaderboard(state.nama, state.kelas, state.skor, timeStr);
            } else {
                state.isRolling = false;
            }
        }

        // BACKEND CALLS (Safe data passing primitives)
        function saveDataAndLoadLeaderboard(nama, kelas, skor, waktu) {
            // Primitive parsing enforce before send
            runBackend('savePlayerScore', String(nama), String(kelas), Number(skor), String(waktu))
                .then(res => {
                    document.getElementById('save-status').innerText = "Data tersimpan! " + (res.playId || '');
                    document.getElementById('save-status').style.color = "var(--neon-green)";
                    fetchLeaderboard();
                })
                .catch(err => {
                    document.getElementById('save-status').innerText = "Gagal simpan data :(";
                    document.getElementById('save-status').style.color = "var(--danger)";
                    fetchLeaderboard(); // Tetap load mock/existing list
                });
        }

        function fetchLeaderboard() {
            runBackend('getLeaderboard', 1, 10)
                .then(res => {
                    const lbBox = document.getElementById('lb-list');
                    if(res.data && res.data.length > 0) {
                        let html = '';
                        res.data.forEach(d => {
                            html += `
                            <div class="lb-item">
                                <div><span class="rank">#${d.rank}</span> <strong>${d.name}</strong> <span style="font-size:10px; color:var(--text-muted);">(${d.kelas})</span></div>
                                <div class="text-neon" style="text-align:right">${d.score} pts<br><span style="font-size:10px; color:var(--text-muted);">${d.time}</span></div>
                            </div>`;
                        });
                        lbBox.innerHTML = html;
                    } else {
                        lbBox.innerHTML = '<div style="text-align:center; font-size:12px;">Belum ada data.</div>';
                    }
                })
                .catch(err => {
                    document.getElementById('lb-list').innerHTML = '<div style="text-align:center; font-size:12px; color:red;">Gagal memuat leaderboard.</div>';
                });
        }
    </script>
</body>
</html>
