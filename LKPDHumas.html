<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
    .section-title { background: #4CAF50; color: white; padding: 10px; border-radius: 5px; margin-top: 25px; }
    .form-group { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    textarea { height: 80px; resize: vertical; }
    .btn-submit { background-color: #2c3e50; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn-submit:hover { background-color: #1a252f; }
    .help-text { font-size: 0.85em; color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h2>LKPD Refleksi: Humas & Media Humas</h2>
    <p style="text-align:center;">Manajemen SMEKTAN Go Coding</p>
    
    <form id="lkpdForm" onsubmit="submitForm(event)">
      
      <div class="section-title">Data Diri</div>
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" required>
      </div>
      <div class="form-group">
        <label>Kelas / No. Absen</label>
        <input type="text" id="kelas" required>
      </div>

      <div class="section-title">Bagian I: Review Konsep</div>
      <div class="form-group">
        <label>1. Jelaskan pekerjaan Humas dalam satu kalimat!</label>
        <textarea id="q1_definisi" required></textarea>
      </div>
      <div class="form-group">
        <label>2. Sebutkan 2 media Humas paling efektif di era digital & alasannya!</label>
        <textarea id="q2_media" required></textarea>
      </div>

      <div class="section-title">Bagian II: Studi Kasus Pameran SMEKTAN</div>
      <div class="form-group">
        <label>1. Siapa saja target audiens acara ini?</label>
        <textarea id="q3_target" required></textarea>
      </div>
      <div class="form-group">
        <label>2. Pasangkan target audiens dengan Media Humas yang akan dipakai!</label>
        <textarea id="q4_strategi" required></textarea>
      </div>
      <div class="form-group">
        <label>3. Langkah klarifikasi jika ada hoaks pameran batal?</label>
        <textarea id="q5_krisis" required></textarea>
      </div>

      <div class="section-title">Bagian III: Jurnal Refleksi (4F)</div>
      <div class="form-group">
        <label>Facts: Fakta baru apa yang paling menempel hari ini?</label>
        <input type="text" id="f_fakta" required>
      </div>
      <div class="form-group">
        <label>Feelings: Bagaimana perasaanmu belajar materi ini?</label>
        <input type="text" id="f_perasaan" required>
      </div>
      <div class="form-group">
        <label>Findings: Bagian mana yang masih membingungkan?</label>
        <input type="text" id="f_pembelajaran" required>
      </div>
      <div class="form-group">
        <label>Future: Skill kehumasan apa yang berguna untuk karirmu kelak?</label>
        <input type="text" id="f_penerapan" required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Kirim Refleksi LKPD</button>
    </form>
  </div>

  <script>
    function submitForm(event) {
      event.preventDefault(); // Mencegah reload halaman
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = 'Menyimpan data...';
      btn.disabled = true;

      // Mengambil data dari form
      const data = {
        nama: document.getElementById('nama').value,
        kelas: document.getElementById('kelas').value,
        q1_definisi: document.getElementById('q1_definisi').value,
        q2_media: document.getElementById('q2_media').value,
        q3_target: document.getElementById('q3_target').value,
        q4_strategi: document.getElementById('q4_strategi').value,
        q5_krisis: document.getElementById('q5_krisis').value,
        f_fakta: document.getElementById('f_fakta').value,
        f_perasaan: document.getElementById('f_perasaan').value,
        f_pembelajaran: document.getElementById('f_pembelajaran').value,
        f_penerapan: document.getElementById('f_penerapan').value
      };

      // Memanggil fungsi Google Apps Script
      google.script.run
        .withSuccessHandler(function(response) {
          if(response.status === 'success') {
            alert('Luar biasa! LKPD berhasil dikirim. Terima kasih!');
            document.getElementById('lkpdForm').reset();
          } else {
            alert('Gagal menyimpan: ' + response.message);
          }
          btn.innerText = 'Kirim Refleksi LKPD';
          btn.disabled = false;
        })
        .simpanDataLkpd(data);
    }
  </script>
</body>
</html>
