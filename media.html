<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Wajib Mobile-Friendly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Media</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --neon-green: #39ff14;
            --neon-dim: rgba(57, 255, 20, 0.2);
            --dark-bg: #0b0f19;
            --glass-bg: rgba(17, 25, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.125);
            --text-light: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a 0%, var(--dark-bg) 70%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Glassmorphism Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 550px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), 0 0 20px var(--neon-dim);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Typography & Spacing */
        h1, h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: white;
            text-shadow: 0 0 10px var(--neon-dim);
        }
        h1 span {
            color: var(--neon-green);
        }
        p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        /* Inputs & Buttons */
        input[type="text"] {
            width: 100%;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-dim);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 0.75rem;
        }
        .btn-primary {
            background: var(--neon-green);
            color: var(--dark-bg);
            box-shadow: 0 0 15px var(--neon-dim);
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px var(--neon-green);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--glass-border);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Clue Badges & Game Stats */
        .game-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--neon-green);
        }
        .clue-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--neon-green);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-style: italic;
        }
        .clue-item {
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeUp 0.4s forwards ease-out;
        }

        /* Leaderboard Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.9rem;
        }
        th {
            color: var(--neon-green);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pagination button {
            width: auto;
            padding: 0.5rem 1rem;
            margin: 0;
        }

        /* Screens & Transitions */
        .screen {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }
        .screen.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }
        .toast {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            background: #ff3333;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="toast" class="toast">Feedback msg</div>

        <!-- 1. START SCREEN -->
        <div id="screen-start" class="screen active">
            <h1>Guess The <span>Media</span></h1>
            <p style="text-align: center; color: #94a3b8;">Komunikasi Humas Edition</p>
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <input type="text" id="playerName" placeholder="Masukkan Nama Kamu..." autocomplete="off">
                <button class="btn-primary" onclick="startGame()">Mulai Bermain</button>
                <button class="btn-secondary" onclick="showLeaderboard()">Lihat Leaderboard</button>
            </div>
        </div>

        <!-- 2. GAME SCREEN -->
        <div id="screen-game" class="screen">
            <div class="game-header">
                <span id="level-display">Soal 1/3</span>
                <span id="score-display">Skor: 0</span>
            </div>
            
            <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Tebak Istilah Humas:</h2>
            <div id="clues-container" class="clue-box">
                <!-- Clues masuk via JS -->
            </div>

            <div style="margin-top: auto;">
                <input type="text" id="answerInput" placeholder="Jawaban Anda..." autocomplete="off">
                <button class="btn-primary" onclick="submitAnswer()">Jawab</button>
                <button id="btn-next-clue" class="btn-secondary" onclick="useNextClue()">Minta Clue (+)</button>
            </div>
        </div>

        <!-- 3. RESULT SCREEN -->
        <div id="screen-result" class="screen">
            <h1>Game <span>Over!</span></h1>
            <div style="text-align: center; margin: 2rem 0;">
                <p style="font-size: 1.2rem;">Skor Akhir Kamu:</p>
                <div style="font-size: 4rem; font-weight: 700; color: var(--neon-green); text-shadow: 0 0 20px var(--neon-dim);" id="finalScoreDisplay">0</div>
                <p id="saving-status" style="color: #94a3b8; font-size: 0.8rem; margin-top: 1rem;">Menyimpan data...</p>
            </div>
            <div style="margin-top: auto;">
                <button class="btn-primary" onclick="showLeaderboard()">Lihat Papan Peringkat</button>
            </div>
        </div>

        <!-- 4. LEADERBOARD SCREEN -->
        <div id="screen-leaderboard" class="screen">
            <h2>Leader<span>board</span></h2>
            <div style="flex-grow: 1; overflow-y: auto;">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Nama</th>
                            <th>Skor</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <tr><td colspan="3" style="text-align:center;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="btn-prev" class="btn-secondary" onclick="changePage(-1)" disabled>Prev</button>
                <span id="page-info" style="font-size: 0.9rem;">1 / 1</span>
                <button id="btn-next" class="btn-secondary" onclick="changePage(1)" disabled>Next</button>
            </div>
            <button class="btn-primary" style="margin-top: 1rem;" onclick="switchScreen('screen-start')">Kembali ke Home</button>
        </div>
    </div>

    <script>
        /**
         * GEMINI CANVAS FRIENDLY WRAPPER
         * Menjembatani google.script.run dan mock data lokal
         * (Menjamin Safe Data Passing dengan hanya menerima tipe data primitif)
         */
        function apiCall(funcName, ...args) {
            return new Promise((resolve, reject) => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        [funcName](...args);
                } else {
                    // Fallback Dummy Data (Max 3 data sesuai instruksi)
                    console.log(`[Mock API] ${funcName} dipanggil dengan:`, args);
                    setTimeout(() => {
                        if (funcName === 'saveScore') resolve({ status: 'success' });
                        if (funcName === 'getLeaderboardData') {
                            resolve({
                                data: [
                                    ["PLAY-0001", "04 Aug 2026", "Guest Pro", 300],
                                    ["PLAY-0002", "04 Aug 2026", "Humas Master", 250],
                                    ["PLAY-0003", "04 Aug 2026", "Media Newbie", 125]
                                ],
                                totalPages: 1,
                                page: 1
                            });
                        }
                    }, 800);
                }
            });
        }

        /**
         * STATE MANAGEMENT GAME
         */
        const questions = [
            {
                answer: "PRESS RELEASE",
                clues: [
                    "Dokumen tertulis yang dibuat oleh humas/PR.",
                    "Dikirimkan ke wartawan atau redaksi media.",
                    "Berisi informasi resmi/berita terkait perusahaan untuk dipublikasikan."
                ]
            },
            {
                answer: "KONFERENSI PERS",
                clues: [
                    "Sebuah acara tatap muka yang diorganisir oleh perusahaan.",
                    "Mengundang banyak jurnalis secara bersamaan.",
                    "Biasanya ada sesi pernyataan resmi dilanjutkan dengan tanya jawab (Q&A)."
                ]
            },
            {
                answer: "MEDIA SOSIAL",
                clues: [
                    "Platform digital yang jadi alat humas modern.",
                    "Memungkinkan interaksi langsung dua arah dengan audiens.",
                    "Contoh salurannya adalah Instagram, X (Twitter), dan LinkedIn."
                ]
            }
        ];

        let state = {
            playerName: "",
            score: 0,
            currentQIndex: 0,
            currentClueIndex: 0,
            leaderboardPage: 1
        };

        /**
         * UI CONTROLLERS
         */
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function showToast(msg, isError = true) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        /**
         * CORE GAME LOGIC
         */
        function startGame() {
            // SAFE DATA PASSING: Ekstrak nilai murni ke string
            const inputName = document.getElementById('playerName').value.trim();
            if (!inputName) {
                showToast("Nama tidak boleh kosong!");
                return;
            }
            
            state.playerName = String(inputName);
            state.score = 0;
            state.currentQIndex = 0;
            
            document.getElementById('playerName').value = "";
            switchScreen('screen-game');
            loadQuestion();
        }

        function loadQuestion() {
            if (state.currentQIndex >= questions.length) {
                endGame();
                return;
            }

            state.currentClueIndex = 0;
            document.getElementById('level-display').textContent = `Soal ${state.currentQIndex + 1}/${questions.length}`;
            document.getElementById('score-display').textContent = `Skor: ${state.score}`;
            document.getElementById('answerInput').value = "";
            document.getElementById('btn-next-clue').disabled = false;
            document.getElementById('clues-container').innerHTML = "";
            
            renderClue();
        }

        function renderClue() {
            const q = questions[state.currentQIndex];
            const container = document.getElementById('clues-container');
            const clueText = q.clues[state.currentClueIndex];
            
            const clueEl = document.createElement('div');
            clueEl.className = 'clue-item';
            clueEl.textContent = `💡 Clue ${state.currentClueIndex + 1}: ${clueText}`;
            container.appendChild(clueEl);

            if (state.currentClueIndex >= q.clues.length - 1) {
                document.getElementById('btn-next-clue').disabled = true;
            }
        }

        function useNextClue() {
            const q = questions[state.currentQIndex];
            if (state.currentClueIndex < q.clues.length - 1) {
                state.currentClueIndex++;
                renderClue();
            }
        }

        function submitAnswer() {
            // SAFE DATA PASSING: Ekstrak input
            const inputAns = String(document.getElementById('answerInput').value.trim()).toUpperCase();
            const correctAns = questions[state.currentQIndex].answer;

            if (!inputAns) {
                showToast("Isi jawaban dulu!");
                return;
            }

            if (inputAns === correctAns) {
                showToast("Benar!", false);
                // Hitung Poin: 1 clue = 100, 2 clue = 75, 3 clue = 50
                const points = 100 - (state.currentClueIndex * 25);
                state.score += points;
                
                setTimeout(() => {
                    state.currentQIndex++;
                    loadQuestion();
                }, 1000);
            } else {
                showToast("Salah! Coba lagi atau minta clue.");
                document.getElementById('answerInput').value = "";
            }
        }

        async function endGame() {
            switchScreen('screen-result');
            document.getElementById('finalScoreDisplay').textContent = state.score;
            
            const statusEl = document.getElementById('saving-status');
            statusEl.textContent = "Menyimpan skor ke database...";
            
            try {
                // Eksekusi API secara async (primitif data only)
                await apiCall('saveScore', state.playerName, state.score);
                statusEl.textContent = "Skor berhasil disimpan!";
                statusEl.style.color = 'var(--neon-green)';
            } catch (err) {
                statusEl.textContent = "Gagal menyimpan skor.";
                statusEl.style.color = '#ef4444';
            }
        }

        /**
         * LEADERBOARD & LAZY LOADING / PAGINATION
         */
        async function showLeaderboard(page = 1) {
            state.leaderboardPage = page;
            switchScreen('screen-leaderboard');
            
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Loading Server Data...</td></tr>`;
            
            document.getElementById('btn-prev').disabled = true;
            document.getElementById('btn-next').disabled = true;

            try {
                // Request pageSize 5 ke backend
                const res = await apiCall('getLeaderboardData', page, 5);
                renderTable(res.data, res.page, res.totalPages);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Gagal mengambil data</td></tr>`;
            }
        }

        function renderTable(data, currentPage, totalPages) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Belum ada pemain</td></tr>`;
            } else {
                // Data mapping (Rank, Nama, Skor)
                data.forEach((row, index) => {
                    const rank = ((currentPage - 1) * 5) + (index + 1);
                    const tr = document.createElement('tr');
                    
                    let rankHtml = rank;
                    if (rank === 1) rankHtml = '🥇';
                    else if (rank === 2) rankHtml = '🥈';
                    else if (rank === 3) rankHtml = '🥉';

                    tr.innerHTML = `
                        <td>${rankHtml}</td>
                        <td>${row[2]}</td>
                        <td style="color: var(--neon-green); font-weight: bold;">${row[3]}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Update Pagination UI
            document.getElementById('page-info').textContent = `${currentPage} / ${totalPages || 1}`;
            document.getElementById('btn-prev').disabled = currentPage <= 1;
            document.getElementById('btn-next').disabled = currentPage >= totalPages;
        }

        function changePage(delta) {
            const newPage = state.leaderboardPage + delta;
            showLeaderboard(newPage);
        }
    </script>
</body>
</html>
