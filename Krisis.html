<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Digital SMEKTAN</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .card { background-color: var(--card-bg); max-width: 400px; width: 100%; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.9rem; color: #6b7280; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        
        button { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #pesan { margin-top: 15px; text-align: center; font-weight: bold; font-size: 0.9rem; display: none; padding: 10px; border-radius: 6px; }
        .success { background-color: #d1fae5; color: #065f46; }
        .error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>SMEKTAN Digital</h1>
        <p>Portal Presensi Harian</p>
    </div>

    <form id="formPresensi" onsubmit="kirimData(event)">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label for="peran">Sebagai</label>
            <select id="peran" name="peran" required>
                <option value="">-- Pilih Peran --</option>
                <option value="Siswa">Siswa</option>
                <option value="Guru">Guru</option>
                <option value="Staf Administrasi">Staf Administrasi</option>
                <option value="Tamu">Tamu</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status Kehadiran</label>
            <select id="status" name="status" required>
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
            </select>
        </div>

        <button type="submit" id="btnSubmit">Kirim Presensi</button>
    </form>

    <div id="pesan"></div>
</div>

<script>
    function kirimData(event) {
        event.preventDefault(); // Mencegah reload halaman
        
        const btn = document.getElementById('btnSubmit');
        const pesanBox = document.getElementById('pesan');
        
        // Disable tombol saat proses pengiriman
        btn.disabled = true;
        btn.innerText = "Mengirim data...";
        pesanBox.style.display = "none";

        // Ambil data dari form
        const dataForm = {
            nama: document.getElementById('nama').value,
            peran: document.getElementById('peran').value,
            status: document.getElementById('status').value
        };

        // Kirim ke backend (Code.gs)
        google.script.run
            .withSuccessHandler(function(response) {
                btn.disabled = false;
                btn.innerText = "Kirim Presensi";
                pesanBox.style.display = "block";
                
                if(response.success) {
                    pesanBox.className = "success";
                    pesanBox.innerText = response.message;
                    document.getElementById('formPresensi').reset(); // Kosongkan form
                } else {
                    pesanBox.className = "error";
                    pesanBox.innerText = response.message;
                }
            })
            .withFailureHandler(function(error) {
                btn.disabled = false;
                btn.innerText = "Kirim Presensi";
                pesanBox.style.display = "block";
                pesanBox.className = "error";
                pesanBox.innerText = "Gagal terhubung ke server.";
            })
            .simpanPresensi(dataForm);
    }
</script>

</body>
</html>
