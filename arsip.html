<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVE THE OFFICE: Multi-Division Rescue</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8;
            --secondary: #0f172a; --accent: #06b6d4;
            --bg-dark: #090d16;
            --surface-card: rgba(30, 41, 59, 0.75);
            --surface-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1rem;
        }

        #app-container {
            width: 100%; max-width: 1100px; height: 800px;
            background: var(--surface-card); backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        header.hud {
            display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.85); border-bottom: 1px solid var(--surface-border);
        }

        .hud-profile { display: flex; align-items: center; gap: 1rem; }
        .avatar { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.9rem; }
        .hud-stats { display: flex; gap: 1.2rem; align-items: center; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 0.5rem 0.9rem; border-radius: 12px; border: 1px solid var(--surface-border); font-size: 0.85rem; }
        .stat-box span { font-weight: 700; color: var(--accent); }
        .progress-bar-container { width: 140px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.3s; }

        .screen { display: none; width: 100%; height: calc(100% - 75px); padding: 1.8rem; flex-direction: column; overflow-y: auto; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .btn { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; font-size: 0.95rem; font-weight: 600; border-radius: 12px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); color: #000; }

        /* Welcome UI Custom */
        .welcome-box { margin: auto; text-align: center; max-width: 650px; }
        .welcome-box h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.4rem; background: linear-gradient(to right, #60a5fa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; text-align: left;}
        .input-group input, .input-group select { width: 100%; padding: 0.9rem; border-radius: 12px; border: 1px solid var(--surface-border); background: rgba(15, 23, 42, 0.7); color: white; font-size: 1rem; outline: none; }
        
        .game-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 1.2rem; height: 100%; }
        .drag-source { background: rgba(15, 23, 42, 0.6); border-radius: 16px; padding: 1rem; border: 1px solid var(--surface-border); display: flex; flex-direction: column; gap: 0.7rem; overflow-y: auto; }
        .drop-targets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
        .doc-card { background: rgba(30, 41, 59, 0.9); padding: 0.9rem; border-radius: 12px; border: 1px solid var(--surface-border); cursor: grab; font-size: 0.88rem; font-weight: 600; display: flex; justify-content: space-between; transition: transform 0.2s; }
        .drop-zone { background: rgba(15, 23, 42, 0.35); border: 2px dashed var(--surface-border); border-radius: 16px; padding: 0.9rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .drop-zone.hover { border-color: var(--accent); background: rgba(6, 182, 212, 0.12); }
        .drop-zone h4 { font-size: 0.85rem; color: var(--text-muted); }

        .priority-item { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--surface-border); padding: 0.9rem; border-radius: 12px; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .priority-badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 20px; font-weight: 700; }
        .badge-wet { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-normal { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

        .scanner-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 1.2rem; }
        .scanner-bed { width: 360px; height: 230px; background: #1e293b; border: 4px solid #334155; border-radius: 16px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem;}
        .scan-laser { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent); box-shadow: 0 0 15px var(--accent); display: none; }
        .scan-laser.scanning { display: block; animation: scanAnim 1.8s infinite alternate ease-in-out; }
        @keyframes scanAnim { 0% { top: 0%; } 100% { top: 98%; } }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; height: 100%; }
        .report-card { background: rgba(15, 23, 42, 0.6); padding: 1.4rem; border-radius: 16px; border: 1px solid var(--surface-border); }
        .badge-tag { display: inline-block; padding: 0.3rem 0.7rem; background: rgba(245, 158, 11, 0.2); color: var(--warning); border-radius: 20px; font-size: 0.8rem; font-weight: 700; margin: 0.3rem 0.3rem 0 0; }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
        select { padding: 0.6rem 1rem; border-radius: 8px; background: #1e293b; color: white; border: 1px solid var(--surface-border); outline: none; }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- HUD -->
        <header class="hud">
            <div class="hud-profile">
                <div class="avatar">DRO</div>
                <div>
                    <div style="font-weight: 700; font-size: 0.95rem;" id="hud-name">Player Name</div>
                    <div style="font-size: 0.75rem; color: var(--accent); font-weight: bold;" id="hud-group">Divisi -</div>
                </div>
            </div>
            <div class="hud-stats">
                <div class="stat-box">⏱️ <span id="hud-timer">180</span>s</div>
                <div class="stat-box">⭐ <span id="hud-score">0</span> XP</div>
                <div class="stat-box">❤️ <span id="hud-lives">3</span></div>
                <div>
                    <div class="progress-bar-container"><div class="progress-bar-fill" id="hud-progress"></div></div>
                </div>
            </div>
        </header>

        <!-- SCREEN 1: Welcome -->
        <div id="screen-welcome" class="screen active">
            <div class="welcome-box">
                <div style="font-size: 3rem; margin-bottom: 0.5rem;">🏢📂</div>
                <h1>SAVE THE OFFICE</h1>
                <p style="color: var(--accent); font-weight: 600; margin-bottom: 1.5rem;">Multi-Division Rescue System</p>
                
                <div class="input-group">
                    <div>
                        <label style="display:block; margin-bottom:0.5rem; font-size:0.85rem; color:var(--text-muted);">Nama Tim / Siswa</label>
                        <input type="text" id="input-player" placeholder="Contoh: Tim Alpha / Budi" autocomplete="off">
                    </div>
                    <div>
                        <label style="display:block; margin-bottom:0.5rem; font-size:0.85rem; color:var(--text-muted);">Pilih Kelompok (Divisi Kasus)</label>
                        <select id="input-group">
                            <option value="1">Kelompok 1 - Divisi Kepegawaian (HR)</option>
                            <option value="2">Kelompok 2 - Divisi Keuangan</option>
                            <option value="3">Kelompok 3 - Divisi Kesiswaan</option>
                            <option value="4">Kelompok 4 - Divisi Kurikulum</option>
                            <option value="5">Kelompok 5 - Divisi Humas</option>
                            <option value="6">Kelompok 6 - Divisi Sarpras</option>
                            <option value="7">Kelompok 7 - Divisi Pimpinan (Kepsek)</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-success" style="width: 100%; font-size: 1.05rem;" onclick="gameEngine.startGame()">Mulai Misi Penyelamatan Divisi 🚀</button>
            </div>
        </div>

        <!-- SCREEN 2: Game -->
        <div id="screen-game" class="screen">
            <div id="level-canvas" style="height: 100%;"></div>
        </div>

        <!-- SCREEN 3: Dashboard -->
        <div id="screen-dashboard" class="screen">
            <h2 style="margin-bottom: 1rem; font-size: 1.4rem; text-align: center;">📊 Dashboard Evaluasi Divisi</h2>
            <div class="dashboard-grid">
                <div class="report-card">
                    <h3 style="color: var(--accent); margin-bottom: 0.8rem;">Profil Kelompok</h3>
                    <p><strong>Nama:</strong> <span id="rep-name">-</span></p>
                    <p style="margin-top:0.4rem;"><strong>Divisi:</strong> <span id="rep-div">-</span></p>
                    <p style="margin-top:0.4rem;"><strong>Skor Akhir:</strong> <span id="rep-score" style="color:var(--success); font-weight:bold;">0</span> XP</p>
                    <p style="margin-top:0.4rem;"><strong>Kelulusan Misi:</strong> <span id="rep-status">Berhasil</span></p>
                    <div id="rep-badges" style="margin-top: 1rem;"></div>
                </div>
                <div class="report-card">
                    <h3 style="color: var(--accent); margin-bottom: 0.8rem;">Catatan Instruksional</h3>
                    <p id="rep-feedback" style="line-height: 1.6; color: var(--text-muted); font-size:0.9rem;"></p>
                    <button class="btn" style="margin-top: 1.5rem; width: 100%;" onclick="location.reload()">Selesai & Ganti Kelompok 🔄</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Web Audio API Synth (Sfx)
        const AudioEngine = {
            ctx: null, init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                this.init(); if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                if (type === 'success') { osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now+0.1); gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.3); osc.start(now); osc.stop(now+0.3); }
                else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.3); osc.start(now); osc.stop(now+0.3); }
                else if (type === 'scan') { osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(600, now+1.2); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now+1.2); osc.start(now); osc.stop(now+1.2); }
            }
        };

        // Database Studi Kasus 7 Kelompok (Dynamic Mission Data)
        const missionDatabase = {
            1: {
                divName: "Kepegawaian (HR)",
                l1: { 
                    docs: [{id:'d1', n:'SK Pengangkatan', c:'Kepegawaian'}, {id:'d2', n:'Formulir Cuti', c:'Formulir'}, {id:'d3', n:'Surat Tugas', c:'Surat'}], 
                    cats: ['Kepegawaian', 'Formulir', 'Surat'] 
                },
                l2: { items: [{n:'Buku Panduan HR', u:false, r:'Bisa dicetak ulang'}, {n:'Daftar Hadir Manual (Basah)', u:true, r:'Bukti fisik vital absensi'}, {n:'Draft Evaluasi', u:false, r:'Hanya draft'}] },
                l3: { docText: 'Daftar Hadir Manual' },
                l4: { blocks: ['2026-08-01', '_', 'Absensi', '_', 'Guru.pdf'], sop: '2026-08-01_Absensi_Guru.pdf' },
                l5: { files: [{id:'f1', n:'2026-08-01_Absensi_Guru.pdf', f:'Presensi'}], cats: ['Rekrutmen', 'Presensi', 'Pensiun'] },
                l7: { target: '2026-08-01_Absensi_Guru.pdf', searchHint: 'Cari berkas Absensi Guru' }
            },
            2: {
                divName: "Keuangan (Finance)",
                l1: { 
                    docs: [{id:'d1', n:'Laporan BOS', c:'Laporan'}, {id:'d2', n:'Slip Gaji', c:'Keuangan'}, {id:'d3', n:'Form Reimburse', c:'Formulir'}], 
                    cats: ['Laporan', 'Keuangan', 'Formulir'] 
                },
                l2: { items: [{n:'Laporan Pajak Tahunan (Basah)', u:true, r:'Dokumen audit sangat penting!'}, {n:'Brosur Bank', u:false, r:'Tidak penting'}, {n:'Nota Fotokopi', u:false, r:'Nominal kecil'}] },
                l3: { docText: 'Laporan Pajak Tahunan' },
                l4: { blocks: ['2026-12-31', '_', 'LaporanPajak', '_', 'Sekolah.pdf'], sop: '2026-12-31_LaporanPajak_Sekolah.pdf' },
                l5: { files: [{id:'f1', n:'2026-12-31_LaporanPajak_Sekolah.pdf', f:'Pajak'}], cats: ['Pajak', 'Penggajian', 'BOS'] },
                l7: { target: '2026-12-31_LaporanPajak_Sekolah.pdf', searchHint: 'Cari Laporan Pajak Tahunan' }
            },
            3: {
                divName: "Kesiswaan",
                l1: { 
                    docs: [{id:'d1', n:'Form Pendaftaran', c:'Formulir'}, {id:'d2', n:'Buku Induk', c:'Arsip Vital'}, {id:'d3', n:'Surat Panggilan Ortu', c:'Surat'}], 
                    cats: ['Formulir', 'Arsip Vital', 'Surat'] 
                },
                l2: { items: [{n:'Daftar Piket', u:false, r:'Mudah diganti'}, {n:'Ijazah Lulusan (Basah)', u:true, r:'Dokumen negara yang tidak tergantikan!'}, {n:'Jadwal Eskul', u:false, r:'Ada di grup WA'}] },
                l3: { docText: 'Ijazah Lulusan' },
                l4: { blocks: ['2026-05-10', '_', 'Ijazah', '_', 'AngkatanX.pdf'], sop: '2026-05-10_Ijazah_AngkatanX.pdf' },
                l5: { files: [{id:'f1', n:'2026-05-10_Ijazah_AngkatanX.pdf', f:'Kelulusan'}], cats: ['Ekstrakurikuler', 'Kelulusan', 'Bimbingan'] },
                l7: { target: '2026-05-10_Ijazah_AngkatanX.pdf', searchHint: 'Cari Ijazah Angkatan X' }
            },
            4: {
                divName: "Kurikulum",
                l1: { 
                    docs: [{id:'d1', n:'RPP Guru', c:'Modul'}, {id:'d2', n:'Jadwal Pelajaran', c:'Jadwal'}, {id:'d3', n:'Silabus Nasional', c:'Pedoman'}], 
                    cats: ['Modul', 'Jadwal', 'Pedoman'] 
                },
                l2: { items: [{n:'Master Soal Ujian (Basah)', u:true, r:'Rahasia negara/sekolah, harus segera diamankan'}, {n:'Kalender Akademik', u:false, r:'Ada softcopy'}, {n:'Daftar Buku', u:false, r:'Bisa diminta ke perpus'}] },
                l3: { docText: 'Master Soal Ujian Akhir' },
                l4: { blocks: ['2026-11-20', '_', 'MasterSoal', '_', 'UAS.pdf'], sop: '2026-11-20_MasterSoal_UAS.pdf' },
                l5: { files: [{id:'f1', n:'2026-11-20_MasterSoal_UAS.pdf', f:'Evaluasi'}], cats: ['Evaluasi', 'Perangkat Ajar', 'Kalender'] },
                l7: { target: '2026-11-20_MasterSoal_UAS.pdf', searchHint: 'Cari Master Soal UAS' }
            },
            5: {
                divName: "Humas (PR)",
                l1: { 
                    docs: [{id:'d1', n:'MoU Industri', c:'Perjanjian'}, {id:'d2', n:'Brosur PPDB', c:'Publikasi'}, {id:'d3', n:'Surat Undangan DUDI', c:'Surat'}], 
                    cats: ['Perjanjian', 'Publikasi', 'Surat'] 
                },
                l2: { items: [{n:'Buku Tamu', u:false, r:'Data historis biasa'}, {n:'Dokumen MoU Perusahaan (Basah)', u:true, r:'Berdampak hukum & kerjasama'}, {n:'Draft Press Release', u:false, r:'Ada di laptop'}] },
                l3: { docText: 'Dokumen MoU Perusahaan' },
                l4: { blocks: ['2026-02-15', '_', 'MoU', '_', 'PT_MajuJaya.pdf'], sop: '2026-02-15_MoU_PT_MajuJaya.pdf' },
                l5: { files: [{id:'f1', n:'2026-02-15_MoU_PT_MajuJaya.pdf', f:'Kemitraan'}], cats: ['Kemitraan', 'Dokumentasi', 'Publikasi'] },
                l7: { target: '2026-02-15_MoU_PT_MajuJaya.pdf', searchHint: 'Cari MoU PT Maju Jaya' }
            },
            6: {
                divName: "Sarana Prasarana",
                l1: { 
                    docs: [{id:'d1', n:'Daftar Inventaris', c:'Laporan'}, {id:'d2', n:'Form Peminjaman Alat', c:'Formulir'}, {id:'d3', n:'Buku Garansi', c:'Legal'}], 
                    cats: ['Laporan', 'Formulir', 'Legal'] 
                },
                l2: { items: [{n:'Sertifikat Tanah Sekolah (Basah)', u:true, r:'Aset legal tertinggi instansi!'}, {n:'Manual Book Proyektor', u:false, r:'Bisa dicari di internet'}, {n:'Jadwal Kebersihan', u:false, r:'Biasa saja'}] },
                l3: { docText: 'Sertifikat Tanah Asli' },
                l4: { blocks: ['2026-01-01', '_', 'Sertifikat', '_', 'AsetTanah.pdf'], sop: '2026-01-01_Sertifikat_AsetTanah.pdf' },
                l5: { files: [{id:'f1', n:'2026-01-01_Sertifikat_AsetTanah.pdf', f:'Legalitas Aset'}], cats: ['Maintenance', 'Legalitas Aset', 'Pengadaan'] },
                l7: { target: '2026-01-01_Sertifikat_AsetTanah.pdf', searchHint: 'Cari Sertifikat Aset Tanah' }
            },
            7: {
                divName: "Pimpinan (Kepsek)",
                l1: { 
                    docs: [{id:'d1', n:'Visi Misi', c:'Pedoman'}, {id:'d2', n:'Notulen Rapat Pleno', c:'Notulen'}, {id:'d3', n:'SK Kepsek', c:'Kepegawaian'}], 
                    cats: ['Pedoman', 'Notulen', 'Kepegawaian'] 
                },
                l2: { items: [{n:'SK Pendirian Yayasan (Basah)', u:true, r:'Dokumen historis dan hukum absolut'}, {n:'Majalah Sekolah', u:false, r:'Ada arsip digital di web'}, {n:'Kumpulan Pidato', u:false, r:'Teks pidato biasa'}] },
                l3: { docText: 'SK Pendirian Yayasan' },
                l4: { blocks: ['1990-08-17', '_', 'SKPendirian', '_', 'Sekolah.pdf'], sop: '1990-08-17_SKPendirian_Sekolah.pdf' },
                l5: { files: [{id:'f1', n:'1990-08-17_SKPendirian_Sekolah.pdf', f:'Dokumen Yayasan'}], cats: ['Rapat Strategis', 'Dokumen Yayasan', 'Regulasi'] },
                l7: { target: '1990-08-17_SKPendirian_Sekolah.pdf', searchHint: 'Cari SK Pendirian' }
            }
        };

        const gameEngine = {
            playerName: "", groupId: 1, myData: null,
            score: 0, lives: 3, timeLeft: 200, currentLevel: 1, timerInterval: null,
            assembledName: "",

            startGame() {
                const name = document.getElementById('input-player').value;
                if (!name.trim()) return alert("Masukkan Nama Tim/Siswa!");
                this.playerName = name;
                this.groupId = document.getElementById('input-group').value;
                this.myData = missionDatabase[this.groupId];

                document.getElementById('hud-name').innerText = this.playerName;
                document.getElementById('hud-group').innerText = `Divisi: ${this.myData.divName}`;
                
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('screen-game').classList.add('active');
                
                this.startTimer(); this.loadLevel(1);
            },

            startTimer() {
                this.timerInterval = setInterval(() => {
                    this.timeLeft--; document.getElementById('hud-timer').innerText = this.timeLeft;
                    if (this.timeLeft <= 0) this.endGame(false, "Waktu Penyelamatan Habis!");
                }, 1000);
            },

            addScore(pts) { this.score += pts; document.getElementById('hud-score').innerText = this.score; AudioEngine.play('success'); },
            deductLife() {
                this.lives--; document.getElementById('hud-lives').innerText = this.lives; AudioEngine.play('error');
                document.getElementById('app-container').classList.add('shake');
                setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);
                if (this.lives <= 0) this.endGame(false, "Kehabisan nyawa! Berkas rusak.");
            },

            loadLevel(lvl) {
                this.currentLevel = lvl;
                document.getElementById('hud-progress').style.width = `${(lvl/7)*100}%`;
                const cv = document.getElementById('level-canvas'); cv.innerHTML = '';
                
                if(lvl===1) this.renderL1(cv); else if(lvl===2) this.renderL2(cv);
                else if(lvl===3) this.renderL3(cv); else if(lvl===4) this.renderL4(cv);
                else if(lvl===5) this.renderL5(cv); else if(lvl===6) this.renderL6(cv);
                else if(lvl===7) this.renderL7(cv); else this.endGame(true, "");
            },

            renderL1(cv) {
                cv.innerHTML = `<h3 style="text-align:center; margin-bottom:1rem;">Misi 1: Kategorisasi Dokumen ${this.myData.divName}</h3><div class="game-grid"><div class="drag-source" id="s1"></div><div class="drop-targets" id="t1"></div></div>`;
                const data = this.myData.l1;
                data.docs.forEach(d => {
                    const el = document.createElement('div'); el.className='doc-card'; el.draggable=true; el.innerText=d.n; el.dataset.c=d.c;
                    el.ondragstart = e => e.dataTransfer.setData('text', d.n);
                    document.getElementById('s1').appendChild(el);
                });
                data.cats.forEach(c => {
                    const z = document.createElement('div'); z.className='drop-zone'; z.innerHTML=`<h4>📁 ${c}</h4>`;
                    z.ondragover = e => { e.preventDefault(); z.classList.add('hover'); };
                    z.ondragleave = () => z.classList.remove('hover');
                    z.ondrop = e => {
                        e.preventDefault(); z.classList.remove('hover');
                        const docName = e.dataTransfer.getData('text');
                        const draggedEl = Array.from(document.getElementById('s1').children).find(el => el.innerText === docName);
                        if(draggedEl && draggedEl.dataset.c === c) {
                            z.appendChild(draggedEl); draggedEl.draggable=false; draggedEl.style.borderColor='var(--success)'; this.addScore(20);
                            if(document.getElementById('s1').children.length===0) setTimeout(()=>this.loadLevel(2), 800);
                        } else this.deductLife();
                    };
                    document.getElementById('t1').appendChild(z);
                });
            },

            renderL2(cv) {
                cv.innerHTML = `<div style="text-align:center; max-width:600px; margin:auto;"><h3>Misi 2: Prioritas Darurat ${this.myData.divName}</h3><p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Pilih dokumen yang paling rentan rusak / vital!</p><div id="p-list"></div></div>`;
                this.myData.l2.items.forEach(i => {
                    const el = document.createElement('div'); el.className='priority-item';
                    el.innerHTML = `<div><div style="font-weight:600">${i.n}</div><div style="font-size:0.8rem;color:var(--text-muted)">${i.r}</div></div><span class="priority-badge ${i.u?'badge-wet':'badge-normal'}">${i.u?'URGENT':'AMAN'}</span>`;
                    el.onclick = () => { if(i.u) { this.addScore(30); this.loadLevel(3); } else { alert("Salah prioritas!"); this.deductLife(); } };
                    document.getElementById('p-list').appendChild(el);
                });
            },

            renderL3(cv) {
                cv.innerHTML = `<div class="scanner-container"><h3>Misi 3: Scan Berkas (${this.myData.divName})</h3>
                    <div class="scanner-bed"><div id="scan-txt" style="color:var(--text-muted);">📄 [ ${this.myData.l3.docText} ]</div><div class="scan-laser" id="laser"></div></div>
                    <div><select id="sf"><option value="jpg">JPG</option><option value="pdf" selected>PDF (SOP)</option></select>
                    <select id="sd"><option value="72">72 DPI</option><option value="300" selected>300 DPI (SOP)</option></select>
                    <button class="btn btn-success" onclick="gameEngine.doScan()">Scan Resolusi Tinggi 🖨️</button></div></div>`;
            },
            doScan() {
                if(document.getElementById('sf').value!=='pdf' || document.getElementById('sd').value!=='300') return this.deductLife();
                document.getElementById('laser').classList.add('scanning'); AudioEngine.play('scan');
                document.getElementById('scan-txt').innerText = "⏳ Memindai...";
                setTimeout(() => { this.addScore(30); this.loadLevel(4); }, 1500);
            },

            renderL4(cv) {
                this.assembledName = "";
                cv.innerHTML = `<div style="text-align:center; max-width:600px; margin:auto;"><h3>Misi 4: Standar Penamaan File SOP</h3><p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">SOP: <code>YYYY-MM-DD_Jenis_Nama.pdf</code></p>
                    <div id="n-tgt" style="min-height:55px; background:rgba(15,23,42,0.8); border:2px dashed var(--accent); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:0.4rem; padding:0.5rem; margin-bottom:1rem;"></div>
                    <div id="n-src" style="display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;"></div>
                    <button class="btn btn-success" style="margin-top:1rem;" onclick="gameEngine.cekNama()">Verifikasi Nama ✔️</button></div>`;
                
                // Acak urutan tombol
                const blocks = [...this.myData.l4.blocks].sort(() => Math.random() - 0.5);
                blocks.forEach(b => {
                    const btn = document.createElement('button'); btn.className='btn'; btn.innerText=b;
                    btn.onclick = () => { this.assembledName+=b; btn.style.display='none'; document.getElementById('n-tgt').innerText = this.assembledName; };
                    document.getElementById('n-src').appendChild(btn);
                });
            },
            cekNama() {
                if(this.assembledName === this.myData.l4.sop) { this.addScore(40); this.loadLevel(5); }
                else { alert(`Format Salah! Seharusnya:\n${this.myData.l4.sop}`); this.deductLife(); this.renderL4(document.getElementById('level-canvas')); }
            },

            renderL5(cv) {
                cv.innerHTML = `<h3 style="text-align:center; margin-bottom:1rem;">Misi 5: Penyusunan Folder Digital</h3><div class="game-grid"><div class="drag-source" id="s5"></div><div class="drop-targets" id="t5"></div></div>`;
                const data = this.myData.l5;
                data.files.forEach(f => {
                    const el = document.createElement('div'); el.className='doc-card'; el.draggable=true; el.innerText=f.n; el.dataset.f=f.f;
                    el.ondragstart = e => e.dataTransfer.setData('text', f.n);
                    document.getElementById('s5').appendChild(el);
                });
                data.cats.forEach(c => {
                    const z = document.createElement('div'); z.className='drop-zone'; z.innerHTML=`<h4>📁 ${c}</h4>`;
                    z.ondragover = e => { e.preventDefault(); z.classList.add('hover'); };
                    z.ondragleave = () => z.classList.remove('hover');
                    z.ondrop = e => {
                        e.preventDefault(); z.classList.remove('hover');
                        const docName = e.dataTransfer.getData('text');
                        const draggedEl = Array.from(document.getElementById('s5').children).find(el => el.innerText === docName);
                        if(draggedEl && draggedEl.dataset.f === c) {
                            z.appendChild(draggedEl); draggedEl.draggable=false; draggedEl.style.borderColor='var(--success)'; this.addScore(30);
                            if(document.getElementById('s5').children.length===0) setTimeout(()=>this.loadLevel(6), 800);
                        } else this.deductLife();
                    };
                    document.getElementById('t5').appendChild(z);
                });
            },

            renderL6(cv) {
                cv.innerHTML = `<div style="text-align:center; max-width:600px; margin:auto;"><h3>Misi 6: Cloud Sync & Backup</h3><p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Atur sinkronisasi otomatis untuk departemen <strong>${this.myData.divName}</strong></p>
                    <div style="background:rgba(255,255,255,0.05); padding:1.5rem; border-radius:12px; text-align:left;">
                        <label style="display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem;"><input type="checkbox" id="c1" style="width:18px;height:18px;"> Aktifkan Auto-Sync Cloud</label>
                        <label style="display:flex; align-items:center; gap:0.6rem; margin-bottom:1rem;"><input type="checkbox" id="c2" style="width:18px;height:18px;"> Aktifkan Enkripsi Data Sensitif</label>
                        <button class="btn btn-success" style="width:100%;" onclick="gameEngine.doCloud()">Unggah Aman ☁️</button>
                    </div></div>`;
            },
            doCloud() {
                if(document.getElementById('c1').checked && document.getElementById('c2').checked) { this.addScore(20); this.loadLevel(7); }
                else { alert("Aktifkan seluruh protokol keamanan (Auto-Sync & Enkripsi)!"); this.deductLife(); }
            },

            renderL7(cv) {
                cv.innerHTML = `<div style="height:100%; display:flex; flex-direction:column;">
                    <div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); padding:0.8rem; border-radius:12px; margin-bottom:1rem; text-align:center;">
                    🚨 <strong>PANGGILAN DARURAT KEPSEK:</strong> ${this.myData.l7.searchHint}</div>
                    <input type="text" id="sq" placeholder="Ketik nama file..." style="width:100%; padding:0.8rem; border-radius:12px; background:rgba(15,23,42,0.8); color:white; border:1px solid var(--surface-border); outline:none; margin-bottom:1rem;" onkeyup="gameEngine.doSearch()">
                    <div id="sr" style="display:flex; flex-direction:column; gap:0.6rem;"></div></div>`;
                this.doSearch();
            },
            doSearch() {
                const q = document.getElementById('sq')?.value.toLowerCase() || '';
                const rs = document.getElementById('sr'); rs.innerHTML = '';
                // Mix target with random dummies
                const files = [this.myData.l7.target, '2026-01-01_LaporanBiasa.pdf', 'Draft_Kosong.pdf', 'Jadwal_Revisi2.pdf'];
                files.forEach(f => {
                    if(f.toLowerCase().includes(q)) {
                        const el = document.createElement('div'); el.className='doc-card';
                        el.innerHTML = `<span>📄 ${f}</span> <button class="btn btn-warning" style="padding:0.3rem 0.7rem; font-size:0.75rem;">Buka</button>`;
                        el.onclick = () => {
                            if(f === this.myData.l7.target) { this.addScore(50); this.loadLevel(8); }
                            else { alert("Salah berkas!"); this.deductLife(); }
                        };
                        rs.appendChild(el);
                    }
                });
            },

            endGame(isSuccess, reason) {
                clearInterval(this.timerInterval);
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('screen-dashboard').classList.add('active');

                document.getElementById('rep-name').innerText = this.playerName;
                document.getElementById('rep-div').innerText = this.myData.divName;
                document.getElementById('rep-score').innerText = this.score;
                document.getElementById('rep-status').innerText = isSuccess ? "Misi Divisi Tuntas! 🎉" : "Misi Terhenti ❌";
                document.getElementById('rep-status').style.color = isSuccess ? "var(--success)" : "var(--danger)";

                const badges = document.getElementById('rep-badges');
                badges.innerHTML = isSuccess ? `<span class="badge-tag">🏆 Master of ${this.myData.divName}</span><span class="badge-tag">⚡ Fast Rescuer</span>` : `<span class="badge-tag">⭐ Staff Magang</span>`;

                document.getElementById('rep-feedback').innerText = isSuccess 
                    ? `Kerja luar biasa! Tim ${this.playerName} telah berhasil menyelamatkan arsip spesifik divisi ${this.myData.divName} sesuai dengan SOP Keamanan Data Perkantoran.`
                    : `Evaluasi: Tim ${this.playerName} dari divisi ${this.myData.divName} membutuhkan simulasi ulang. Catatan: ${reason}`;
            }
        };
    </script>
</body>
</html>
