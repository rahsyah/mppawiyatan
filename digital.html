<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Office Idle Tycoon</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .dashboard {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
      width: 100%;
      max-width: 900px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
      min-width: 220px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .stat-card h3 {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-card .value {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--green);
      margin-top: 5px;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    /* Left Panel: Clicker Action */
    .action-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .scan-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      border: none;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .scan-btn:active {
      transform: scale(0.95);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .click-info {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Right Panel: Upgrades */
    .upgrades-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .upgrades-panel h2 {
      font-size: 1.3rem;
      margin-bottom: 15px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .upgrade-card {
      background: #0f172a;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #1e293b;
    }

    .upgrade-info h4 {
      font-size: 1rem;
      color: var(--accent);
    }

    .upgrade-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .upgrade-btn {
      background: var(--green);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .upgrade-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .upgrade-btn:not(:disabled):hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏢 Digital Office Tycoon</h1>
    <p>Kelola dan modernisasi dokumen untuk meningkatkan pendapatan perusahaan!</p>
  </header>

  <section class="dashboard">
    <div class="stat-card">
      <h3>Kas Perusahaan</h3>
      <div class="value" id="money-display">Rp 0</div>
    </div>
    <div class="stat-card">
      <h3>Pendapatan Pasif</h3>
      <div class="value" id="cps-display">Rp 0 /detik</div>
    </div>
  </section>

  <main class="main-container">
    <!-- Tombol Scan Manual -->
    <div class="action-panel">
      <button class="scan-btn" id="scan-btn">
        <span>📑</span>
        <span>SCAN DOKUMEN</span>
      </button>
      <div class="click-info">
        Hasil per klik: <b id="cpc-display" style="color: var(--accent);">Rp 1</b>
      </div>
    </div>

    <!-- Panel Upgrade Infrastruktur -->
    <div class="upgrades-panel">
      <h2>Peningkatan Infrastruktur</h2>
      <div class="upgrade-list" id="upgrade-list">
        <!-- Upgrade items akan dibuat otomatis lewat JS -->
      </div>
    </div>
  </main>

  <script>
    // System Game State
    let state = {
      money: 0,
      clickPower: 1,
      cps: 0
    };

    // Daftar Upgrade Sesuai Spesifikasi
    const upgrades = [
      {
        id: 'scanner',
        name: '🖨️ Scanner Modern',
        desc: '+1 Pendapatan/Klik & +1/dtk per level.',
        cost: 15,
        level: 0,
        cpsBoost: 1,
        cpcBoost: 1,
        multiplier: 1.15
      },
      {
        id: 'server',
        name: '🖥️ Server Lokal',
        desc: 'Memproses antrean data otomatis (+5/dtk).',
        cost: 100,
        level: 0,
        cpsBoost: 5,
        cpcBoost: 0,
        multiplier: 1.15
      },
      {
        id: 'nas',
        name: '🗄️ NAS Storage',
        desc: 'Penyimpanan terpusat (+25/dtk).',
        cost: 1100,
        level: 0,
        cpsBoost: 25,
        cpcBoost: 0,
        multiplier: 1.15
      },
      {
        id: 'ocr',
        name: '🤖 AI OCR Engine',
        desc: 'Ekstraksi teks otomatis berbasis AI (+120/dtk).',
        cost: 12000,
        level: 0,
        cpsBoost: 120,
        cpcBoost: 0,
        multiplier: 1.15
      },
      {
        id: 'cloud',
        name: '☁️ Cloud Infrastructure',
        desc: 'Akses global & skalabilitas tanpa batas (+700/dtk).',
        cost: 130000,
        level: 0,
        cpsBoost: 700,
        cpcBoost: 0,
        multiplier: 1.15
      },
      {
        id: 'security',
        name: '🛡️ Enterprise Security',
        desc: 'Sistem keamanan enkripsi kelas industri (+4,500/dtk).',
        cost: 1400000,
        level: 0,
        cpsBoost: 4500,
        cpcBoost: 0,
        multiplier: 1.15
      }
    ];

    // Format mata uang Rupiah
    function formatRupiah(number) {
      return 'Rp ' + Math.floor(number).toLocaleString('id-ID');
    }

    // Render UI Upgrade
    function renderUpgrades() {
      const listEl = document.getElementById('upgrade-list');
      listEl.innerHTML = '';

      upgrades.forEach((up, index) => {
        const item = document.createElement('div');
        item.className = 'upgrade-card';
        item.innerHTML = `
          <div class="upgrade-info">
            <h4>${up.name} <small>(Lvl ${up.level})</small></h4>
            <p>${up.desc}</p>
          </div>
          <button class="upgrade-btn" id="btn-${up.id}" onclick="buyUpgrade(${index})">
            ${formatRupiah(up.cost)}
          </button>
        `;
        listEl.appendChild(item);
      });
    }

    // Pembelian Upgrade
    function buyUpgrade(index) {
      const up = upgrades[index];
      if (state.money >= up.cost) {
        state.money -= up.cost;
        up.level++;
        state.clickPower += up.cpcBoost;
        state.cps += up.cpsBoost;
        up.cost = Math.floor(up.cost * up.multiplier);

        updateUI();
        renderUpgrades();
      }
    }

    // Klik Scan Manual
    document.getElementById('scan-btn').addEventListener('click', () => {
      state.money += state.clickPower;
      updateUI();
    });

    // Update Status UI & Tombol Purchase
    function updateUI() {
      document.getElementById('money-display').innerText = formatRupiah(state.money);
      document.getElementById('cps-display').innerText = formatRupiah(state.cps) + ' /detik';
      document.getElementById('cpc-display').innerText = formatRupiah(state.clickPower);

      // Check ketersediaan uang untuk setiap tombol upgrade
      upgrades.forEach(up => {
        const btn = document.getElementById(`btn-${up.id}`);
        if (btn) {
          btn.disabled = state.money < up.cost;
        }
      });
    }

    // Game Loop (Berjalan setiap 100ms untuk kelancaran animasi pendapatan)
    setInterval(() => {
      if (state.cps > 0) {
        state.money += state.cps / 10;
        updateUI();
      }
    }, 100);

    // Inisialisasi awal
    renderUpgrades();
    updateUI();
  </script>

</body>
</html>
